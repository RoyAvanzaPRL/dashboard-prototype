<div id="client" class="mx-auto max-w-6xl px-5 py-6 sm:px-8 sm:py-8">
  <a href="#/clientes" class="text-sm text-stone-500 hover:text-ink">← Clientes</a>
  <p data-bind="sector" class="mt-4 text-[11px] uppercase tracking-[0.14em] text-stone-500"></p>
  <h2 data-bind="name" class="mt-1 font-serif text-4xl tracking-tight"></h2>

  <dl class="mt-8 grid gap-px overflow-hidden rounded-xl border border-line bg-line sm:grid-cols-2">
    <div class="bg-panel px-4 py-3">
      <dt class="text-[11px] uppercase tracking-[0.14em] text-stone-500">Contacto</dt>
      <dd data-bind="contact" class="mt-1 text-sm"></dd>
      <dd data-bind="role" class="text-xs text-stone-500"></dd>
    </div>
    <div class="bg-panel px-4 py-3">
      <dt class="text-[11px] uppercase tracking-[0.14em] text-stone-500">Correo</dt>
      <dd class="mt-1 text-sm"><a data-bind="emailLink" class="underline decoration-stone-300 underline-offset-4"></a></dd>
    </div>
    <div class="bg-panel px-4 py-3">
      <dt class="text-[11px] uppercase tracking-[0.14em] text-stone-500">Teléfono</dt>
      <dd data-bind="phone" class="mt-1 text-sm tabular-nums"></dd>
    </div>
    <div class="bg-panel px-4 py-3">
      <dt class="text-[11px] uppercase tracking-[0.14em] text-stone-500">Dirección</dt>
      <dd data-bind="address" class="mt-1 text-sm"></dd>
    </div>
  </dl>

  <section class="mt-6 rounded-xl border border-line bg-panel px-4 py-4">
    <h3 class="text-[11px] uppercase tracking-[0.14em] text-stone-500">Nota interna</h3>
    <p data-bind="note" class="mt-2 max-w-2xl text-sm leading-relaxed"></p>
  </section>

  <section class="mt-8">
    <h3 class="text-[11px] uppercase tracking-[0.14em] text-stone-500">Expedientes</h3>
    <div id="client-matters" class="mt-3 overflow-hidden rounded-xl border border-line bg-panel px-4"></div>
  </section>
</div>
<div id="client-missing" hidden class="mx-auto max-w-6xl px-5 py-8">
  <p class="font-serif text-3xl">Ese cliente no está en la mesa.</p>
  <a class="mt-4 inline-block text-sm text-copper" href="#/clientes">Volver al listado</a>
</div>
