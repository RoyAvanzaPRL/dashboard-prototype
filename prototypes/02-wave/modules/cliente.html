<section id="client" class="rounded-[28px] bg-white px-7 py-6 shadow-[0_10px_30px_rgba(30,36,51,0.04)]">
  <a href="#/clientes" class="text-sm font-medium text-violet">← Clientes</a>
  <p data-bind="sector" class="mt-4 text-[11px] font-semibold tracking-[0.12em] text-mute"></p>
  <h2 data-bind="name" class="mt-1 text-2xl font-semibold tracking-tight"></h2>
  <dl class="mt-6 grid grid-cols-2 gap-3">
    <div class="rounded-2xl bg-canvas px-4 py-3">
      <dt class="text-[11px] font-semibold tracking-[0.12em] text-mute">CONTACTO</dt>
      <dd data-bind="contact" class="mt-1 text-sm"></dd>
      <dd data-bind="role" class="text-xs text-mute"></dd>
    </div>
    <div class="rounded-2xl bg-canvas px-4 py-3">
      <dt class="text-[11px] font-semibold tracking-[0.12em] text-mute">CORREO</dt>
      <dd class="mt-1 text-sm"><a data-bind="emailLink" class="text-violet"></a></dd>
    </div>
    <div class="rounded-2xl bg-canvas px-4 py-3">
      <dt class="text-[11px] font-semibold tracking-[0.12em] text-mute">TELÉFONO</dt>
      <dd data-bind="phone" class="mt-1 text-sm"></dd>
    </div>
    <div class="rounded-2xl bg-canvas px-4 py-3">
      <dt class="text-[11px] font-semibold tracking-[0.12em] text-mute">DIRECCIÓN</dt>
      <dd data-bind="address" class="mt-1 text-sm"></dd>
    </div>
  </dl>
  <section class="mt-5 rounded-2xl bg-[#f4f1ff] px-4 py-4">
    <h3 class="text-[11px] font-semibold tracking-[0.12em] text-violet">NOTA INTERNA</h3>
    <p data-bind="note" class="mt-2 max-w-3xl text-sm leading-relaxed"></p>
  </section>
  <h3 class="mt-6 text-[11px] font-semibold tracking-[0.14em] text-mute">EXPEDIENTES</h3>
  <div id="client-matters" class="mt-2"></div>
</section>
<section id="client-missing" hidden class="rounded-[28px] bg-white px-7 py-8">
  <p class="text-lg font-semibold">Ese cliente no está en la mesa.</p>
  <a class="mt-3 inline-block text-sm font-medium text-violet" href="#/clientes">Volver al listado</a>
</section>
