<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Albor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              violet: "#6d4dff",
              aqua: "#2fbfae",
              blush: "#f06b9a",
              ink: "#1e2433",
              mute: "#8b93a7",
              line: "#eceef2",
              canvas: "#f3f6f8",
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="h-screen overflow-hidden bg-[#e7eef2] p-7 font-sans text-ink">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="relative z-10 flex h-full overflow-hidden rounded-[28px] bg-white shadow-[0_30px_80px_rgba(70,90,110,0.16)]">
      <aside class="relative z-20 flex w-[228px] shrink-0 flex-col overflow-visible px-5 py-6">
        <a href="#/resumen" class="flex items-center gap-2 px-2">
          <span class="inline-flex size-6 items-center justify-center rounded-md bg-aqua text-white">
            <svg viewBox="0 0 16 16" class="size-3.5" fill="currentColor" aria-hidden="true">
              <path d="M3 9.5c2.2-4 4.2-6 8.5-7-.4 2.4-.2 4.2 1 6.2-2.4.2-4.6-.4-6.2-1.6C5.2 8.6 4 10.4 3 12.5 2.2 11.2 2.2 10.2 3 9.5Z"></path>
            </svg>
          </span>
          <span class="text-[17px] font-semibold tracking-tight text-violet">Albor</span>
        </a>
        <nav class="mt-6 flex flex-1 flex-col gap-1 pt-[4.75rem] pb-16" aria-label="Módulos">
          <a href="#/resumen" data-nav="resumen" class="nav-link">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
            Resumen
          </a>
          <a href="#/expedientes" data-nav="expedientes" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M4 7.5h6l2 2H20v9.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-11.5Z"></path></svg>
            Expedientes
          </a>
          <a href="#/clientes" data-nav="clientes" class="nav-link">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"></circle><path d="M4 18.5c.6-2.4 2.4-3.5 5-3.5s4.4 1.1 5 3.5"></path><circle cx="17" cy="9.5" r="2.2"></circle><path d="M16 15c1.8.2 3.2 1.1 3.8 3.5"></path></svg>
            Clientes
          </a>
          <a href="#/agenda" data-nav="agenda" class="nav-link">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3.5v3M16 3.5v3M4 10h16"></path></svg>
            Agenda
          </a>
          <a href="#/documentos" data-nav="documentos" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M7 3.5h7l5 5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z"></path><path d="M14 3.5V9h5"></path></svg>
            Documentos
          </a>
          <a href="#/equipo" data-nav="equipo" class="nav-link mt-auto">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M18.2 5.8l-1.4 1.4M7.2 16.8l-1.4 1.4"></path></svg>
            Equipo
          </a>
        </nav>
      </aside>

      <div class="flex min-w-0 flex-1 flex-col pr-5 pt-5">
        <header class="flex h-14 shrink-0 items-center justify-end gap-5 px-3">
          <button id="header-search" type="button" class="text-mute hover:text-ink" aria-label="Buscar">
            <svg viewBox="0 0 24 24" class="size-5"><circle cx="11" cy="11" r="6"></circle><path d="M16 16.5 20 20.5"></path></svg>
          </button>
          <div class="relative">
            <button id="notice-toggle" type="button" class="relative text-mute hover:text-ink" aria-expanded="false" aria-controls="notice-panel" aria-label="Avisos">
              <svg viewBox="0 0 24 24" class="size-5"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.2 1.5H4.8L6 16.5Z"></path><path d="M10 19.5a2 2 0 0 0 4 0"></path></svg>
              <span class="absolute right-0 top-0 size-1.5 rounded-full bg-blush"></span>
            </button>
            <div id="notice-panel" hidden class="absolute right-0 top-10 z-20 w-80 rounded-2xl border border-line bg-white p-2 shadow-[0_16px_40px_rgba(30,36,51,0.12)]">
              <a href="#/expediente/EXP-2026-019" class="block rounded-xl px-3 py-2.5 hover:bg-canvas">
                <p class="text-sm font-medium">Contestación de Nou Transport</p>
                <p class="text-xs text-mute">Vence mañana a las 13:00</p>
              </a>
              <a href="#/expediente/EXP-2026-003" class="block rounded-xl px-3 py-2.5 hover:bg-canvas">
                <p class="text-sm font-medium">Informe pericial de Helvetia</p>
                <p class="text-xs text-mute">Entró el lunes. Revisión el viernes</p>
              </a>
              <a href="#/expediente/EXP-2025-088" class="block rounded-xl px-3 py-2.5 hover:bg-canvas">
                <p class="text-sm font-medium">Clara dejó la tasación de Riera</p>
                <p class="text-xs text-mute">Lista para la propuesta del día 16</p>
              </a>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right leading-tight">
              <p class="text-[11px] font-semibold tracking-[0.12em] text-ink">MARINA SOLER</p>
              <p class="text-xs text-mute">Socia</p>
            </div>
            <span class="inline-flex size-10 items-center justify-center rounded-full bg-gradient-to-br from-[#d9d0ff] to-[#b7efe4] text-xs font-semibold text-violet">MS</span>
          </div>
        </header>
        <main id="main" class="mb-5 min-h-0 flex-1 overflow-y-auto rounded-[32px] bg-canvas p-5"></main>
      </div>
    </div>
    <style>
      .blob {
        position: absolute;
        filter: blur(2px);
      }
      .blob-a {
        top: -90px;
        right: 6%;
        width: 560px;
        height: 420px;
        border-radius: 58% 42% 48% 52%;
        background: #c9f3e8;
      }
      .blob-b {
        bottom: -120px;
        left: 4%;
        width: 460px;
        height: 380px;
        border-radius: 46% 54% 42% 58%;
        background: #d7e8f8;
      }
      .blob-c {
        top: 18%;
        left: -80px;
        width: 300px;
        height: 260px;
        border-radius: 50% 50% 46% 54%;
        background: #e4e8ee;
      }
      .nav-link {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 12px;
        padding: 10px 12px;
        color: #8b93a7;
        font-size: 14.5px;
        font-weight: 500;
        text-decoration: none;
      }
      .nav-link svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-link:hover {
        color: #4b5568;
      }
      .nav-link.is-active {
        z-index: 1;
        margin-right: -20px;
        padding-right: 28px;
        border-radius: 16px 0 0 16px;
        background: #f3f6f8;
        color: #6d4dff;
        font-weight: 600;
      }
      .nav-link.is-active:hover {
        color: #6d4dff;
      }
      .nav-link.is-active::before,
      .nav-link.is-active::after {
        content: "";
        position: absolute;
        right: -1px;
        width: 28px;
        height: 28px;
        pointer-events: none;
      }
      .nav-link.is-active::before {
        top: -28px;
        background: radial-gradient(circle at 0 0, transparent 27px, #f3f6f8 28px);
      }
      .nav-link.is-active::after {
        bottom: -28px;
        background: radial-gradient(circle at 0 100%, transparent 27px, #f3f6f8 28px);
      }
      header svg,
      .icon-btn svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .is-selected {
        background: #f4f5f8;
      }
      .act {
        color: #c5cad3;
      }
      .is-selected .act-open {
        color: #2fbfae;
      }
      .is-selected .act-edit {
        color: #6d4dff;
      }
      .is-selected .act-more {
        color: #f06b9a;
      }
      .is-selected [data-check] {
        border-color: #6d4dff;
        background: #6d4dff;
        box-shadow: inset 0 0 0 3px white;
      }
      #main svg,
      .act svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .act svg {
        width: 16px;
        height: 16px;
      }
      #main [data-row] > span,
      #main a.grid > span:last-child {
        min-width: 0;
      }
      #main a.grid > span:last-child {
        white-space: nowrap;
      }
      #main [data-client] > span:nth-child(3),
      #main [data-client] > span:nth-child(4) {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #6d4dff;
        outline-offset: 2px;
      }
    </style>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
