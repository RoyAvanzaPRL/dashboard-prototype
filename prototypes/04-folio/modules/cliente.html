<section id="client" class="h-full overflow-y-auto px-8 py-6">
  <a href="#/clientes" class="text-sm font-semibold text-brand">← Clientes</a>
  <p data-bind="sector" class="mt-4 text-[11px] font-bold tracking-wide text-mute"></p>
  <h1 data-bind="name" class="mt-1 text-2xl font-bold tracking-tight"></h1>
  <dl class="mt-6 grid grid-cols-2 gap-3">
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">CONTACTO</dt>
      <dd data-bind="contact" class="mt-1 text-sm"></dd>
      <dd data-bind="role" class="text-xs text-mute"></dd>
    </div>
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">CORREO</dt>
      <dd class="mt-1 text-sm"><a data-bind="emailLink" class="font-semibold text-brand"></a></dd>
    </div>
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">TELÉFONO</dt>
      <dd data-bind="phone" class="mt-1 text-sm"></dd>
    </div>
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">DIRECCIÓN</dt>
      <dd data-bind="address" class="mt-1 text-sm"></dd>
    </div>
  </dl>
  <section class="mt-4 rounded-2xl bg-[#f4f1ff] px-5 py-4">
    <h2 class="text-[11px] font-bold tracking-wide text-brand">NOTA INTERNA</h2>
    <p data-bind="note" class="mt-2 max-w-3xl text-sm leading-relaxed"></p>
  </section>
  <h2 class="mt-6 text-[11px] font-bold tracking-wide text-mute">EXPEDIENTES</h2>
  <div id="client-matters" class="mt-2 overflow-hidden rounded-2xl border border-line bg-white"></div>
</section>
<section id="client-missing" hidden class="px-8 py-8">
  <p class="text-lg font-semibold">Ese cliente no está en la mesa.</p>
  <a class="mt-3 inline-block text-sm font-semibold text-brand" href="#/clientes">Volver al listado</a>
</section>
