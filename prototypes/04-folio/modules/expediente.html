<section id="matter" class="h-full overflow-y-auto px-8 py-6">
  <a href="#/expedientes" class="text-sm font-semibold text-brand">← Expedientes</a>
  <div class="mt-4 flex flex-wrap items-center gap-2 text-sm">
    <p data-bind="id" class="text-mute"></p>
    <p data-bind="status"></p>
    <p data-bind="area" class="rounded-md bg-[#f3f4f6] px-2 py-0.5 text-xs font-semibold text-[#5c6570]"></p>
  </div>
  <h1 data-bind="title" class="mt-2 text-2xl font-bold tracking-tight"></h1>
  <p data-bind="summary" class="mt-2 max-w-3xl text-sm leading-relaxed text-[#5c6570]"></p>

  <dl class="mt-6 grid grid-cols-3 gap-3">
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">CLIENTE</dt>
      <dd class="mt-1 text-sm"><a data-bind="clientLink" class="font-semibold text-brand"></a></dd>
    </div>
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">CONTRARIO</dt>
      <dd data-bind="opponent" class="mt-1 text-sm"></dd>
    </div>
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">ÓRGANO</dt>
      <dd data-bind="court" class="mt-1 text-sm"></dd>
    </div>
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">RESPONSABLE</dt>
      <dd data-bind="lead" class="mt-1 text-sm"></dd>
    </div>
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">CUANTÍA</dt>
      <dd data-bind="amount" class="mt-1 text-sm"></dd>
    </div>
    <div class="rounded-2xl border border-line bg-white px-4 py-3">
      <dt class="text-[11px] font-bold tracking-wide text-mute">ABIERTO</dt>
      <dd data-bind="opened" class="mt-1 text-sm"></dd>
    </div>
  </dl>

  <section class="mt-4 rounded-2xl bg-[#f4f1ff] px-5 py-4">
    <p class="text-[11px] font-bold tracking-wide text-brand">SIGUIENTE PASO</p>
    <p data-bind="next" class="mt-1 text-lg font-bold"></p>
    <p data-bind="nextWhen" class="text-sm text-[#5c6570]"></p>
  </section>

  <div class="mt-6 grid grid-cols-[minmax(0,1.4fr)_minmax(0,0.8fr)] gap-8">
    <section>
      <h2 class="text-[11px] font-bold tracking-wide text-mute">CRONOLOGÍA</h2>
      <ol id="timeline" class="mt-2"></ol>
    </section>
    <section>
      <h2 class="text-[11px] font-bold tracking-wide text-mute">DOCUMENTOS</h2>
      <ul id="documents" class="mt-2"></ul>
      <p class="mt-4 text-xs text-mute">Procurador · <span data-bind="procurador"></span></p>
    </section>
  </div>
</section>
<section id="matter-missing" hidden class="px-8 py-8">
  <p class="text-lg font-semibold">Ese expediente no está en la mesa.</p>
  <a class="mt-3 inline-block text-sm font-semibold text-brand" href="#/expedientes">Volver al listado</a>
</section>
